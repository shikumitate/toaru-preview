<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | とある株式会社</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    body {
      min-height: 100vh;
      font-family: 'Noto Sans JP', sans-serif;
      color: #0e2349;
      background-color: #edebbf;
      background-image: url("images/0e428730-22e1-40f2-a932-715a91df63ec.png");
      background-size: 220px 220px;
    }
    .wrap {
      min-height: 100vh;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .logo { width: 88px; height: auto; border-radius: 12px; margin: 0 0 32px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; line-height: 1.6; }
    .lead { margin: 0 0 36px; font-size: 15px; line-height: 1.9; }
    .lead br { display: none; }
    @media (min-width: 601px) { .lead br { display: inline; } }
    .home {
      display: inline-block;
      padding: 14px 40px;
      background-color: #0e2349;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
    }
    .nav { margin-top: 32px; font-size: 14px; }
    .nav a { color: #0e2349; text-decoration: underline; padding: 4px 8px; display: inline-block; }
    @media (max-width: 600px) {
      .logo { width: 72px; margin-bottom: 24px; }
      h1 { font-size: 19px; }
      .lead { font-size: 14px; }
      .home { padding: 13px 32px; font-size: 14px; }
      .nav { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="images/045fe9c1-6d6a-4776-a452-a813eab86640.jpg" alt="とある株式会社">
    <h1>ページが見つかりませんでした</h1>
    <p class="lead">お探しのページは、移動または削除された可能性があります。<br>お手数ですが、下のリンクからお探しください。</p>
    <a class="home" href="/">トップページへ</a>
    <nav class="nav">
      <a href="/about.html">会社案内</a>
      <a href="/service.html">事業案内</a>
      <a href="/recruit.html">採用情報</a>
    </nav>
  </div>
</body>
</html>
